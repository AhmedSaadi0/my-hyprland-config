# -------------------------------------------------------------------
# INPUT
# -------------------------------------------------------------------
input {
    kb_layout = us,ara
    kb_options = grp:win_space_toggle

    follow_mouse = 1
    mouse_refocus = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}

# -------------------------------------------------------------------
# GENERAL
# -------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 12, 10, 10, 52

    border_size = 2

    # col.active_border = rgba(FDEAB0ff) rgba(fd77e0ff) 45deg # Change the angle for a different look
    # col.inactive_border = rgba(50505088)

    layout = dwindle
}

# -------------------------------------------------------------------
# ANIMATIONS
# -------------------------------------------------------------------
animations {
    enabled = true

    # Modern curves: smooth, crisp, and consistent
    bezier = ease_out, 0.22, 1, 0.36, 1
    bezier = ease_in, 0.4, 0, 1, 1
    bezier = ease_in_out, 0.45, 0, 0.55, 1
    bezier = soft, 0.2, 0.8, 0.2, 1

    # Window movement (gaps / layout changes)
    animation = windowsMove, 1, 5, ease_in_out, slide

    # Window enter/exit (more elegant, slightly softer)
    animation = windows, 1, 6, soft, slidefade 18%
    animation = windowsOut, 1, 5, ease_in, slidefade 12%

    # Border and fades
    animation = border, 1, 8, soft
    animation = fadeIn, 1, 3, ease_out
    animation = fadeOut, 1, 3, ease_in

    # Workspace transitions (a bit faster)
    animation = workspaces, 1, 3, ease_in_out, slidefade 6%
}



dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true 
    preserve_split = true 
    # special_scale_factor = 1
    # permanent_direction_override = true 
    # split_width_multiplier = 1
    # force_split = 1
    # preserve_split = true
    # smart_resizing = false
}

