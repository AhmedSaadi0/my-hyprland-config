# -------------------------------------------------------------------
# INPUT
# -------------------------------------------------------------------
input {
    kb_layout = us,ara
    kb_options = grp:win_space_toggle

    follow_mouse = 1
    mouse_refocus = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}

# -------------------------------------------------------------------
# GENERAL
# -------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 12, 10, 10, 52

    border_size = 2

    # col.active_border = rgba(FDEAB0ff) rgba(fd77e0ff) 45deg # Change the angle for a different look
    # col.inactive_border = rgba(50505088)

    layout = dwindle
}

# -------------------------------------------------------------------
# DECORATION
# -------------------------------------------------------------------
animations {
    enabled = true

    # منحنيات هادئة ومضبوطة لشاشة 120Hz:
    # سرعة واضحة بدون مطاطية أو ارتداد يسبب jitter
    bezier = win_in, 0.16, 1, 0.3, 1
    bezier = win_out, 0.3, 0, 0.6, 1
    bezier = move, 0.2, 0.85, 0.15, 1
    bezier = ui, 0.25, 0.1, 0.25, 1
    bezier = launch, 0.12, 0.95, 0.22, 1

    # حركة النوافذ عند الترتيب أو تغيير المساحات
    # animation = windowsMove, 1, 7, move, slide

    bezier = accelerate, 0.5, 0.0, 1.0, 1.0
    animation = windowsMove, 1, 2.5, accelerate, slide

    # فتح التطبيقات: pop-in خفيف يعطي إحساس إطلاق ناعم ومتماسك
    animation = windows, 1, 8, launch, popin 90%
    animation = windowsOut, 1, 7, win_out, popin 88%

    # حدود ناعمة بدون overshoot
    animation = border, 1, 10, ui
    animation = borderangle, 1, 12, ui

    # تلاشي واضح لكن سريع
    animation = fadeIn, 1, 8, launch
    animation = fadeOut, 1, 6, win_out

    # التنقل بين الـ workspaces يكون سلايد أنظف على 120Hz
    animation = workspaces, 1, 7, move, slide
}



dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true 
    preserve_split = true 
    # special_scale_factor = 1
    # permanent_direction_override = true 
    # split_width_multiplier = 1
    # force_split = 1
    # preserve_split = true
    # smart_resizing = false
}

