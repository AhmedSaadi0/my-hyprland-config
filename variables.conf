# -------------------------------------------------------------------
# الإدخال | INPUT
# -------------------------------------------------------------------
input {
    kb_layout = us,ara
    kb_options = grp:win_space_toggle

    follow_mouse = 1
    mouse_refocus = 1

    touchpad {
        natural_scroll = false
    }

    sensitivity = 0
}

# -------------------------------------------------------------------
# عام | GENERAL
# -------------------------------------------------------------------
general {
    gaps_in = 5
    gaps_out = 3, 10, 10, 10

    border_size = 2

    # col.active_border = rgba(FDEAB0ff) rgba(fd77e0ff) 45deg # تغيير الزاوية لمظهر مختلف
    # col.inactive_border = rgba(50505088)

    layout = dwindle
}

# -------------------------------------------------------------------
# الديكور | DECORATION
# -------------------------------------------------------------------
decoration {
    rounding = 16

    # محسن: إعدادات ضبابية (blur) أكثر جودة ووضوحاً
    blur {
        enabled = true
        size = 4      # زيادة الحجم لتأثير ضبابي أقوى
        passes = 2    # 3 تمريرات هي توازن ممتاز بين الجودة والأداء
        noise = 0.01
        new_optimizations = true
        brightness = 1
        ignore_opacity = true
        xray = true
        popups = true
    }

    # محسن: تفعيل الظلال هو أهم تغيير جمالي لإضافة العمق
    # drop_shadow = yes
    # shadow_range = 30
    # shadow_render_power = 3
    # col.shadow = rgba(00000044) # ظل أسود ناعم وشبه شفاف

    # محسن: تفعيل تعتيم النوافذ غير النشطة لزيادة التركيز على النافذة الفعالة
    dim_inactive = true
    dim_strength = 0.00
    dim_special = 0
}

# ===================================================================
# HYPRLAND CONFIG - ELASTIC & LIVELY by AI
# ===================================================================
animations {
    enabled = true

    # منحنيات مخصصة مستوحاة من Google Material Design و macOS
    bezier = decel, 0.05, 0.7, 0.1, 1        # للدخول (تخفيف السرعة)
    bezier = accel, 0.4, 0, 0.6, 1           # للخروج (تسريع)
    bezier = overshoot, 0.34, 1.56, 0.64, 1  # اهتزاز خفيف عند التوقف
    bezier = md_standard, 0.2, 0, 0, 1       # منحنى ثابت مستقر

    # نوافذ تدخل بانزلاق وشفافية ناعمة + تخرج بقوة خفيفة
    animation = windows, 1, 5, decel, slidefade 18%
    animation = windowsOut, 1, 6, accel, slidefade 15%

    # تحسين تأثير الحدود ليكون أكثر ديناميكية ومرونة
    animation = border, 1, 10, overshoot

    # التلاشي ناعم جداً، يناسب التطبيقات المنبثقة
    animation = fadeIn, 1, 2, decel
    animation = fadeOut, 1, 2, accel

    # الحركة بين المساحات بسلاسة بدون إزعاج بصري
    animation = workspaces, 1, 3, md_standard, slidefade 8%
}



dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true 
    preserve_split = true 
    # special_scale_factor = 1
    # permanent_direction_override = true 
    # split_width_multiplier = 1
    # force_split = 1
    # preserve_split = true
    # smart_resizing = false
}

